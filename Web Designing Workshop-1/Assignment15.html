<!DOCTYPE html>
<html>
<head>
    <title>Personal Details Form</title>
</head>
<body>

<form>

    <fieldset>

        <legend>Personal Details</legend>

        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Password:</label>
        <input type="password">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox">Reading
        <input type="checkbox">Coding
        <br><br>

        <label>DOB:</label>
        <input type="date">

    </fieldset>

</form>

</body>
</html>
