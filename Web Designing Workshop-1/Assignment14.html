<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
</head>
<body>

<div style="overflow-x:auto;">

<table border="1" cellspacing="0" cellpadding="8">

    <tr>
        <th>Day</th>
        <th colspan="2">Lab Batches</th>
        <th>Faculty</th>
        <th>Room</th>
        <th>Time</th>
    </tr>

    <tr>
        <th></th>
        <th>Batch</th>
        <th>System</th>
        <th></th>
        <th></th>
        <th></th>
    </tr>

    <tr>
        <td rowspan="2">Friday</td>
        <td>A1</td>
        <td>PC 1-20</td>
        <td rowspan="2">Dr. Sharma</td>
        <td rowspan="2">Lab 2</td>
        <td rowspan="2">2-4 PM</td>
    </tr>

    <tr>
        <td>A2</td>
        <td>PC 21-40</td>
    </tr>

</table>

</div>

</body>
</html>
