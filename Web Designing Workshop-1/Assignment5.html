<!DOCTYPE html>
<html>
    <head>
        <title>Unordered,Ordered and Description Lists</title>
    </head>
    <body>
        <h1>Unordered</h1>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <h1>Ordered</h1>
        <ol type="A">
            <li>Install Vs Code</li>
            <li>Create file</li>
            <li>Open in browser</li>
        </ol>

        <h1>Description</h1>
        <dl>
            <dt>HTML</dt>
            <dd>Hypertext Markup Language</dd>
            <dt>CSS</dt>
            <dd>Cascading Style Sheets</dd>
        </dl>
    </body>
</html>
