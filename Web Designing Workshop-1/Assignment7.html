<!DOCTYPE html>
<html>
    <head>
        <title>Navigation Menu</title>
        <style>
            ul {
                list-style-type: none;
                background-color: black;
                padding: 10px;
            }
            li {
                display: inline-block;
                margin-right: 10px;
            }
            a {
                text-decoration: none;
                color: white;
            }
        </style>
    </head>
    <body>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contacts</a></li>
        </ul>
    </body>
</html>
